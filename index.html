<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손맛분식 고객응대 챗봇</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter / Nanum Gothic for Korean -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        /* Custom scrollbar for chat window */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff7ed;
        }
        ::-webkit-scrollbar-thumb {
            background: #fdba74;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-orange-50 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header: Store name, location, and hours -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-600 text-white shadow-md p-4 flex flex-col items-center justify-center relative shrink-0">
        <div class="absolute top-3 left-3 bg-white/20 px-2.5 py-1 rounded-full text-xs font-medium backdrop-blur-sm">
            달빛시장 3번 골목
        </div>
        <h1 class="text-2xl font-bold tracking-wide mt-1">손맛분식 🍲</h1>
        <p class="text-orange-100 text-xs sm:text-sm mt-0.5 font-light">
            ⏰ 평일 10:00 ~ 20:00 (토요일 21시까지 / 일요일 휴무)
        </p>
    </header>

    <!-- FAQ Quick Buttons (4 buttons as requested) -->
    <div class="bg-orange-100/80 px-4 py-2.5 border-b border-orange-200 shrink-0">
        <p class="text-xs text-orange-800 font-medium mb-1.5 text-center">💡 자주 묻는 질문을 눌러보세요!</p>
        <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar justify-start sm:justify-center">
            <button onclick="sendFAQ('몇 시까지 하세요?')" class="whitespace-nowrap bg-white text-orange-700 hover:bg-orange-500 hover:text-white border border-orange-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition font-medium">
                영업시간이 어떻게 되나요?
            </button>
            <button onclick="sendFAQ('메뉴 추천해 주세요')" class="whitespace-nowrap bg-white text-orange-700 hover:bg-orange-500 hover:text-white border border-orange-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition font-medium">
                추천 메뉴는 무엇인가요?
            </button>
            <button onclick="sendFAQ('포장 되나요?')" class="whitespace-nowrap bg-white text-orange-700 hover:bg-orange-500 hover:text-white border border-orange-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition font-medium">
                포장 가능한가요?
            </button>
            <button onclick="sendFAQ('주차할 곳 있나요?')" class="whitespace-nowrap bg-white text-orange-700 hover:bg-orange-500 hover:text-white border border-orange-300 text-xs px-3 py-1.5 rounded-full shadow-sm transition font-medium">
                주차장이 있나요?
            </button>
        </div>
    </div>

    <!-- Chat Messages Area -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-2xl w-full mx-auto">
        <!-- Welcome Message -->
        <div class="flex items-start space-x-2">
            <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-sm font-bold shadow shrink-0">
                손맛
            </div>
            <div class="bg-white text-gray-800 p-3.5 rounded-2xl rounded-tl-sm shadow-sm max-w-[80%] text-sm leading-relaxed border border-orange-100">
                안녕하세요! <span class="font-semibold text-orange-600">손맛분식</span>에 오신 것을 환영합니다. 🥟<br>
                궁금하신 점을 편하게 물어봐 주세요!
            </div>
        </div>
    </main>

    <!-- Input Form Footer -->
    <footer class="bg-white border-t border-orange-200 p-3 sm:p-4 shrink-0 shadow-lg">
        <form id="chatForm" onsubmit="handleUserSubmit(event)" class="max-w-2xl mx-auto flex gap-2">
            <input 
                type="text" 
                id="userInput" 
                placeholder="질문을 입력해 주세요 (예: 영업시간, 메뉴, 포장 등)..." 
                class="flex-1 bg-orange-50/50 border border-orange-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition"
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-600 hover:to-amber-700 text-white px-5 py-3 rounded-xl text-sm font-semibold shadow-md transition flex items-center justify-center shrink-0"
            >
                전송
            </button>
        </form>
    </footer>

    <script>
        // FAQ Dataset (10 items total as requested)
        const faqDatabase = [
            {
                questions: ["몇 시까지 하세요?", "언제까지 해요?", "영업시간", "마감 시간", "몇 시에 열어요"],
                answer: "평일은 10시부터 20시까지, 토요일은 21시까지입니다. 일요일은 쉽니다."
            },
            {
                questions: ["메뉴 추천해 주세요", "뭐가 맛있어요?", "추천", "인기 메뉴", "대표 메뉴"],
                answer: "우리 매장 대표 메뉴는 매콤달콤한 쌀떡볶이와 수제 야채김밥입니다! 국물 떡볶이도 인기가 많아요."
            },
            {
                questions: ["포장 되나요?", "포장", "테이크아웃", "싸갈 수 있나요"],
                answer: "네! 모든 메뉴 포장 가능합니다. 미리 전화 주시면 기다리지 않고 바로 찾아가실 수 있어요."
            },
            {
                questions: ["주차할 곳 있나요?", "주차", "차 가지고 가는데", "주차장"],
                answer: "달빛시장 공영주차장을 이용하시면 편리합니다. (식사 고객 1시간 주차권 지원)"
            },
            {
                questions: ["위치가 어디예요?", "어디에 있어요?", "주소", "찾아오는 길", "가게 위치"],
                answer: "달빛시장 3번 골목 안쪽으로 쭉 들어오시면 우측에 손맛분식이 보입니다."
            },
            {
                questions: ["휴무일 언제예요?", "쉬는 날", "일요일 영업", "언제 쉬나요"],
                answer: "매주 일요일은 정기 휴무일입니다. 평일과 토요일에 방문해 주세요!"
            },
            {
                questions: ["전화번호가 뭐예요?", "연락처", "전화", "번호 알려줘"],
                answer: "가게 전화번호는 02-XXX-XXXX 입니다. 단체 주문이나 예약 시 문의해 주세요."
            },
            {
                questions: ["배달 되나요?", "배달", "배달의민족", "쿠팡이츠", "요기요"],
                answer: "현재 배달 앱을 통한 배달 서비스는 운영하고 있지 않으며, 매장 방문 또는 포장 주문만 가능합니다."
            },
            {
                questions: ["카드 결제 되나요?", "현금", "카드", "계좌이체", "결제 방식"],
                answer: "네, 신용카드 결제 및 제로페이, 온누리상품권 모두 사용 가능합니다."
            },
            {
                questions: ["아기 의자 있나요?", "유모차", "아기", "가족", "좌석"],
                answer: "매장 공간이 아담하여 아기 의자는 따로 준비되어 있지 않습니다. 이 점 양해 부탁드립니다!"
            }
        ];

        // Fallback response when no matching FAQ is found
        const fallbackAnswer = "확인이 어렵습니다. 사장님께 직접 여쭤봐 주세요.";

        // Append message to chat container
        function appendMessage(sender, text) {
            const container = document.getElementById('chatContainer');
            const isUser = sender === 'user';

            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-2 ${isUser ? 'justify-end' : 'justify-start'} mb-3`;

            if (!isUser) {
                // Bot Avatar
                const avatar = document.createElement('div');
                avatar.className = 'w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center text-sm font-bold shadow shrink-0';
                avatar.textContent = '손맛';
                wrapper.appendChild(avatar);
            }

            const bubble = document.createElement('div');
            bubble.className = isUser 
                ? 'bg-orange-500 text-white p-3.5 rounded-2xl rounded-tr-sm shadow-sm max-w-[80%] text-sm leading-relaxed' 
                : 'bg-white text-gray-800 p-3.5 rounded-2xl rounded-tl-sm shadow-sm max-w-[80%] text-sm leading-relaxed border border-orange-100';
            
            // Format line breaks
            bubble.innerHTML = text.replace(/\n/g, '<br>');
            wrapper.appendChild(bubble);

            if (isUser) {
                // User Avatar placeholder if desired or keep clean
            }

            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        // Simulate typing delay for natural chatbot feel
        function botReply(matchedAnswer) {
            setTimeout(() => {
                appendMessage('bot', matchedAnswer);
            }, 400);
        }

        // Find best matching FAQ based on keyword overlap
        function findBestAnswer(query) {
            const cleanQuery = query.trim().toLowerCase();
            if (!cleanQuery) return null;

            let bestMatch = null;
            let maxScore = 0;

            for (const item of faqDatabase) {
                for (const q of item.questions) {
                    const cleanQ = q.toLowerCase();
                    // Exact match or contains keyword
                    if (cleanQuery === cleanQ || cleanQuery.includes(cleanQ) || cleanQ.includes(cleanQuery)) {
                        const score = cleanQ.length;
                        if (score > maxScore) {
                            maxScore = score;
                            bestMatch = item.answer;
                        }
                    }
                }
            }

            // Keyword fallback check (checking individual words)
            if (!bestMatch) {
                for (const item of faqDatabase) {
                    for (const q of item.questions) {
                        const keywords = q.split(' ');
                        let matchCount = 0;
                        keywords.forEach(kw => {
                            if (kw.length > 1 && cleanQuery.includes(kw)) {
                                matchCount++;
                            }
                        });
                        if (matchCount > 0 && matchCount > maxScore) {
                            maxScore = matchCount;
                            bestMatch = item.answer;
                        }
                    }
                }
            }

            return bestMatch || fallbackAnswer;
        }

        // Handle text input submission
        function handleUserSubmit(event) {
            event.preventDefault();
            const input = document.getElementById('userInput');
            const query = input.value.trim();

            if (!query) return;

            // Display user message
            appendMessage('user', query);
            input.value = '';

            // Find answer and reply
            const answer = findBestAnswer(query);
            botReply(answer);
        }

        // Handle quick FAQ button clicks
        function sendFAQ(questionText) {
            appendMessage('user', questionText);
            const answer = findBestAnswer(questionText);
            botReply(answer);
        }
    </script>
</body>
</html>
